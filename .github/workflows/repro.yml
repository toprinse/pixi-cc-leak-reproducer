name: repro

on:
  push:
  workflow_dispatch:

jobs:
  aarch64-runner-build-linux-64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - run: pixi build --target-platform=linux-64

  aarch64-runner-build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          run-install: false
      - run: pixi build --target-platform=linux-aarch64